version: 2

updates:
  - package-ecosystem: composer
    directory: /apps/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pest 5.3.1 calls the paratest 7.26.0 worker constructor. 7.26.1 adds
      # an argument and breaks the parallel runner. Drop this once Pest moves.
      - dependency-name: brianium/paratest
        versions: ["7.26.1"]
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /apps/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-js-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/mail
    schedule:
      interval: monthly
    ignore:
      # Maizzle 6 changes the CLI and the config format. Move to it on purpose,
      # then drop this.
      - dependency-name: "@maizzle/framework"
        update-types: ["version-update:semver-major"]
    groups:
      mail:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /.docker/production/images
    schedule:
      interval: monthly

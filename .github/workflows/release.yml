---
# Cuts a release from anywhere: the Actions tab, the GitHub phone app, or
# `gh workflow run release.yml` from a terminal or an agent. Every input is
# optional.
#
# 1. Picks the version: the one given, or the next one after the latest tag.
#    Rider notes under New make it a minor release, anything else a patch.
# 2. Moves every branch's rider notes from apps/app/resources/releases/unreleased
#    into the version's folder, with the title and summary riders see. A title
#    or summary left empty is written by Copilot when the COPILOT_TOKEN secret is
#    set. Without it, or when Copilot fails, the release is named by its first
#    change and has no summary.
# 3. Commits that to main, then publishes the GitHub release with the generated
#    technical notes. Publishing starts Production Deploy and the Garmin build.
#
# It pushes and publishes with RELEASE_TOKEN: a fine-grained token of a
# maintainer, with Contents read and write on this repository. The workflow's
# own token cannot pass the main branch rules, and a release it publishes would
# not start the deploy.
#
# COPILOT_TOKEN is optional: a fine-grained token owned by a maintainer's personal
# account, with the account permission Copilot Requests and no repository access.
# Each run that asks Copilot uses one premium request of that account.
#
# A dry run works from any branch, to try a change to this workflow. A release
# only runs from main.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, such as v0.8.0. Empty picks the next one.
        required: false
        type: string
      title:
        description: Title riders see. Empty lets Copilot write one, or names the release by its first change.
        required: false
        type: string
      summary:
        description: One line riders see under the title. Empty lets Copilot write one.
        required: false
        type: string
      dry_run:
        description: Only show what would be released.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NOTES: apps/app/resources/releases

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check The Release Token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" != "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::A release runs from main. Start it from main, or make this a dry run."
            exit 1
          fi
          if [ -z "${RELEASE_TOKEN}" ] && [ "${DRY_RUN}" != "true" ]; then
            echo "::error::Add the RELEASE_TOKEN secret: a fine-grained token with Contents read and write on this repository."
            exit 1
          fi

      - name: Check Out The Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Pick The Version
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          latest="${latest:-v0.0.0}"

          shopt -s nullglob
          notes=("${NOTES}"/unreleased/*.md)
          has_new=false
          for note in "${notes[@]}"; do
            if grep -qiE '^section:[[:space:]]*new[[:space:]]*$' "$note"; then
              has_new=true
            fi
          done

          version="${INPUT_VERSION// /}"
          if [ -z "$version" ]; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [ "$has_new" = true ]; then
              version="v${major}.$((minor + 1)).0"
            else
              version="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A version looks like v1.4.0, not ${version}."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
            echo "::error::${version} is already released."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${latest}" >> "$GITHUB_OUTPUT"
          echo "notes=${#notes[@]}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} after ${latest}, with ${#notes[@]} rider notes."

      - name: Set Up Node For Copilot
        if: steps.plan.outputs.notes != '0' && (inputs.title == '' || inputs.summary == '')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Ask Copilot For The Title And Summary
        id: copilot
        if: steps.plan.outputs.notes != '0' && (inputs.title == '' || inputs.summary == '')
        continue-on-error: true
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_TOKEN}" ]; then
            echo "No COPILOT_TOKEN secret: the release is named by its first change."
            exit 0
          fi

          notes="$(for note in "${NOTES}"/unreleased/*.md; do cat "$note"; printf '\n'; done)"
          prompt="Write the title and the one-line summary of a Traceway release, for riders. Do not use any tools, and do not read or change any file.
          Traceway plans routes for running, walking, hiking, and cycling, and sends them to watches and bike computers.
          Many riders are over 60 and just want routes. Use short, plain, everyday words.
          No technical terms, no version numbers, no emoji, no exclamation marks, no hype.
          Never use the words beacon, kudos, segment, or suffer.
          The title has at most 60 characters, in sentence case, and names the one or two changes riders care about most, such as: Stops that load, and your privacy in writing.
          The summary is one sentence of at most 140 characters that says what changed for the rider.
          Answer with exactly two lines and nothing else:
          TITLE=the title
          SUMMARY=the summary

          The changes in this release:
          ${notes}"

          npm install --global --silent @github/copilot
          answer="$(mktemp)"
          # An empty folder: Copilot has nothing here to read or change.
          (
            cd "$(mktemp -d)"
            COPILOT_GITHUB_TOKEN="${COPILOT_TOKEN}" GH_TOKEN="${COPILOT_TOKEN}" GITHUB_TOKEN="${COPILOT_TOKEN}" \
              timeout 180 copilot -p "$prompt" --allow-all-tools > "$answer" < /dev/null
          )

          title="$(grep -m 1 '^TITLE=' "$answer" | cut -d= -f2- | tr -s '[:space:]' ' ' | sed 's/^ *//; s/ *$//' || true)"
          summary="$(grep -m 1 '^SUMMARY=' "$answer" | cut -d= -f2- | tr -s '[:space:]' ' ' | sed 's/^ *//; s/ *$//' || true)"
          if [ "${#title}" -gt 80 ]; then
            title=""
          fi
          if [ "${#summary}" -gt 200 ]; then
            summary=""
          fi
          if [ -z "$title" ] && [ -z "$summary" ]; then
            echo "::warning::Copilot gave no usable title or summary. The release is named by its first change."
            head -c 400 "$answer"
          fi

          {
            echo "title<<TRACEWAY_EOF"; echo "$title"; echo "TRACEWAY_EOF"
            echo "summary<<TRACEWAY_EOF"; echo "$summary"; echo "TRACEWAY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Copilot's title: ${title}"
          echo "Copilot's summary: ${summary}"

      - name: Set Up PHP
        if: steps.plan.outputs.notes != '0'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer Packages
        if: steps.plan.outputs.notes != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Move The Rider Notes Into The Release
        if: steps.plan.outputs.notes != '0'
        working-directory: apps/app
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TITLE: ${{ inputs.title || steps.copilot.outputs.title }}
          SUMMARY: ${{ inputs.summary || steps.copilot.outputs.summary }}
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan releases:prepare "$VERSION" --title="$TITLE" --summary="$SUMMARY"
          vendor/bin/pest --compact tests/Unit/Quality/RiderNotesFilesTest.php
          echo "### Rider notes for ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          for note in "resources/releases/${VERSION}"/*.md; do
            printf '\n**%s**\n\n' "$(basename "$note")" >> "$GITHUB_STEP_SUMMARY"
            cat "$note" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit The Rider Notes
        if: steps.plan.outputs.notes != '0' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git add -A "$NOTES"
          git commit -m "🔖 release: ${VERSION}" -m "Moves the rider notes of every branch merged since the last release into ${NOTES}/${VERSION}."
          git push origin HEAD:main

      - name: Publish The Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          HAS_NOTES: ${{ steps.plan.outputs.notes != '0' }}
        run: |
          set -euo pipefail
          if [ "$HAS_NOTES" = "true" ]; then
            intro="Rider notes: [${NOTES}/${VERSION}](https://github.com/${GITHUB_REPOSITORY}/tree/${VERSION}/${NOTES}/${VERSION})"
          else
            intro="No rider notes: riders do not see this release in What's new."
          fi
          start=()
          if [ "$PREVIOUS" != "v0.0.0" ]; then
            start=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes "$intro" \
            --generate-notes "${start[@]}" \
            --latest
          echo "Published [${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}). Production Deploy and the Garmin build start from it." >> "$GITHUB_STEP_SUMMARY"

name: Storybook

# Builds and tests both Storybooks (the planner's components, pages and Garmin
# screens, and the content site's own, composed in under Site (Astro)) and the
# design system Claude builds from them, so a broken story, an accessibility
# fault or a token that drifted from the CSS fails here. They are published
# with each release, inside the production image, at traceway.online/storybook
# (.docker/production/images/Dockerfile).

on:
  pull_request:
    paths:
      - .github/workflows/storybook.yml
      - apps/app/**
      - apps/web/**
      - apps/garmin/store/**
      - apps/garmin/resources/**
      - .docker/production/images/configs/nginx/**
      - .docker/production/images/Dockerfile
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, exif, intl, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Cache Bun Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('apps/app/bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      # The page stories import Wayfinder's routes, which artisan generates.
      - name: Generate Routes
        working-directory: apps/app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan wayfinder:generate --with-form

      - name: Install Planner Dependencies
        working-directory: apps/app
        run: bun install --frozen-lockfile

      # --prefix keeps npm on the site's own lockfile, as ci.yml does.
      - name: Install Content Site Dependencies
        working-directory: apps/web
        run: npm ci --prefix .

      # The site's Storybook, where Astro renders each story. Every story is a
      # test in Chromium: it must render, its play function must pass, and axe
      # must find no accessibility violation.
      - name: Test Content Site Stories
        working-directory: apps/web
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test-storybook

      # The planner's Storybook shows this build under Site (Astro), at ./site.
      # The site itself too, for the overview page at /storybook and the
      # hashes production's nginx config includes.
      - name: Build Content Site And Its Storybook
        working-directory: apps/web
        run: |
          npm run build
          npm run build-storybook

      # Builds Storybook, then the design system from it. Fails when a story
      # breaks or tokens.json no longer matches app.css and planner.css.
      - name: Build Storybook And Design System
        working-directory: apps/app
        run: bun run design-system

      # Every planner story is a test in Chromium, once in Paper and once in
      # Ink: it must render, its play function must pass, and axe must find no
      # accessibility violation. The coverage report shows which components and
      # pages the stories reach.
      - name: Test Planner Stories
        working-directory: apps/app
        run: bun run test:storybook:coverage

      # Both Storybooks and the overview page as production serves them: the
      # production nginx config, Storybook's own headers, and the redirect for
      # a folder without its slash.
      - name: Serve Storybook Like Production
        run: |
          nginx_conf="$(realpath .docker/production/images/configs/nginx)"
          docker run -d --name storybook -p 127.0.0.1:8090:8080 \
            -v "$nginx_conf/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$nginx_conf/security-headers.conf:/etc/nginx/security-headers.conf:ro" \
            -v "$nginx_conf/storybook-headers.conf:/etc/nginx/storybook-headers.conf:ro" \
            -v "$(realpath apps/web/nginx-csp.conf):/etc/nginx/nginx-csp.conf:ro" \
            -v "$(realpath apps/web/dist):/var/www/web:ro" \
            -v "$(realpath apps/app/storybook-static):/var/www/storybook/app:ro" \
            -v "$(realpath apps/web/storybook-static):/var/www/storybook/web:ro" \
            nginx:1.29-alpine > /dev/null
          for attempt in $(seq 1 50); do curl --silent --fail --output /dev/null http://127.0.0.1:8090/storybook && break; sleep 0.2; done
          check() {
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8090$1")
            [ "$status" = "$2" ] || { echo "::error::$1 answered $status, not $2"; exit 1; }
          }
          check /storybook 200
          check /storybook/app 301
          check /storybook/app/ 200
          check /storybook/app/iframe.html 200
          check /storybook/app/mockServiceWorker.js 200
          check /storybook/web/ 200
          check /storybook/web/index.json 200
          headers=$(curl --silent --head http://127.0.0.1:8090/storybook/app/)
          grep -qi "frame-ancestors 'self'" <<< "$headers" || { echo "::error::Storybook lost its frame policy"; exit 1; }
          grep -qi 'x-robots-tag: noindex' <<< "$headers" || { echo "::error::Storybook is not kept out of search"; exit 1; }
          grep -qi 'referrer-policy: same-origin' <<< "$headers" || { echo "::error::Storybook no longer sends its address to Laravel"; exit 1; }
          docker rm -f storybook > /dev/null

      # The docs pages too: every page of the built Storybook, in Paper and in
      # Ink, through axe's colour-contrast rule.
      - name: Check Every Page Is Readable
        working-directory: apps/app
        run: bun run test:storybook:contrast

      - name: Upload Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-reports
          path: |
            apps/app/storybook-coverage
            apps/app/storybook-static/contrast.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Design System
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-system
          path: apps/app/design-system
          retention-days: 14

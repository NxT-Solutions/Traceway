---
name: Production Deploy

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build And Publish Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive Image Name
        id: image
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/traceway"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          echo "image=${name}:${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare Runtime Environment File
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WAHOO_CLIENT_ID: ${{ secrets.WAHOO_CLIENT_ID }}
          WAHOO_CLIENT_SECRET: ${{ secrets.WAHOO_CLIENT_SECRET }}
          RIDEWITHGPS_CLIENT_ID: ${{ secrets.RIDEWITHGPS_CLIENT_ID }}
          RIDEWITHGPS_CLIENT_SECRET: ${{ secrets.RIDEWITHGPS_CLIENT_SECRET }}
          RIDEWITHGPS_API_KEY: ${{ secrets.RIDEWITHGPS_API_KEY }}
          PASSPORT_PRIVATE_KEY: ${{ secrets.PASSPORT_PRIVATE_KEY }}
          PASSPORT_PUBLIC_KEY: ${{ secrets.PASSPORT_PUBLIC_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_LARAVEL_DSN: ${{ secrets.SENTRY_LARAVEL_DSN }}
          SENTRY_RELEASE: ${{ steps.image.outputs.tag }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_WEB_ANALYTICS_SITE_TAG: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_SITE_TAG }}
        run: |
          set -euo pipefail

          runtime_env="/tmp/traceway.runtime.env"
          cp apps/app/.env.production "$runtime_env"

          upsert_env() {
            local key="$1"
            local value="$2"
            local file="$3"
            local escaped_value

            escaped_value="$(printf '%s' "$value" | sed -e 's/[\/&]/\\&/g')"

            if grep -q "^${key}=" "$file"; then
              sed -i "s|^${key}=.*|${key}=${escaped_value}|" "$file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$file"
            fi
          }

          if [ -z "${APP_KEY:-}" ]; then
            echo "APP_KEY secret is required" >&2
            exit 1
          fi

          upsert_env "APP_KEY" "$APP_KEY" "$runtime_env"
          upsert_env "RESEND_API_KEY" "${RESEND_API_KEY:-}" "$runtime_env"

          # Send to device pushes routes to these services. A service whose
          # client is not set stays hidden, so each can go live on its own.
          upsert_env "WAHOO_CLIENT_ID" "${WAHOO_CLIENT_ID:-}" "$runtime_env"
          upsert_env "WAHOO_CLIENT_SECRET" "${WAHOO_CLIENT_SECRET:-}" "$runtime_env"
          upsert_env "RIDEWITHGPS_CLIENT_ID" "${RIDEWITHGPS_CLIENT_ID:-}" "$runtime_env"
          upsert_env "RIDEWITHGPS_CLIENT_SECRET" "${RIDEWITHGPS_CLIENT_SECRET:-}" "$runtime_env"
          upsert_env "RIDEWITHGPS_API_KEY" "${RIDEWITHGPS_API_KEY:-}" "$runtime_env"

          # The check under the sign-up form. Without both keys it stays off
          # and the forms keep only their rate limits.
          upsert_env "TURNSTILE_SITE_KEY" "${TURNSTILE_SITE_KEY:-}" "$runtime_env"
          upsert_env "TURNSTILE_SECRET_KEY" "${TURNSTILE_SECRET_KEY:-}" "$runtime_env"
          if [ -z "${TURNSTILE_SITE_KEY:-}" ] || [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::warning::TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY are not set. Sign-up runs without the person check."
          fi

          # The admin area's Traffic page. A read-only Analytics token, apart
          # from the token that purges the cache. Without it the page says so.
          upsert_env "CLOUDFLARE_ANALYTICS_TOKEN" "${CLOUDFLARE_ANALYTICS_TOKEN:-}" "$runtime_env"
          upsert_env "CLOUDFLARE_ACCOUNT_ID" "${CLOUDFLARE_ACCOUNT_ID:-}" "$runtime_env"
          upsert_env "CLOUDFLARE_ZONE_ID" "${CLOUDFLARE_ZONE_ID:-}" "$runtime_env"
          upsert_env "CLOUDFLARE_WEB_ANALYTICS_SITE_TAG" "${CLOUDFLARE_WEB_ANALYTICS_SITE_TAG:-}" "$runtime_env"
          if [ -z "${CLOUDFLARE_ANALYTICS_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_ANALYTICS_TOKEN is not set. The admin Traffic page says it is not connected."
          fi

          # Errors, traces and logs go to Sentry. Without the DSN nothing is sent.
          upsert_env "SENTRY_LARAVEL_DSN" "${SENTRY_LARAVEL_DSN:-}" "$runtime_env"
          upsert_env "SENTRY_RELEASE" "${SENTRY_RELEASE}" "$runtime_env"
          # The privacy policy says Sentry keeps the reports in Germany, so only
          # a DSN for the EU region may go out.
          case "${SENTRY_LARAVEL_DSN:-}" in
            "")
              echo "::warning::SENTRY_LARAVEL_DSN is not set. Errors are not sent to Sentry."
              ;;
            https://*.ingest.de.sentry.io/*) ;;
            *)
              echo "::error::SENTRY_LARAVEL_DSN must be a DSN for Sentry's EU region (ingest.de.sentry.io)." >&2
              exit 1
              ;;
          esac

          # AI tools sign in with OAuth. Passport signs their tokens with this
          # key pair. The PEM goes on one line, and the quotes turn \n back
          # into line breaks.
          if [ -n "${PASSPORT_PRIVATE_KEY:-}" ] && [ -n "${PASSPORT_PUBLIC_KEY:-}" ]; then
            printf 'PASSPORT_PRIVATE_KEY="%s"\n' "$(printf '%s' "$PASSPORT_PRIVATE_KEY" | awk 'BEGIN { ORS = "\\n" } { print }')" >> "$runtime_env"
            printf 'PASSPORT_PUBLIC_KEY="%s"\n' "$(printf '%s' "$PASSPORT_PUBLIC_KEY" | awk 'BEGIN { ORS = "\\n" } { print }')" >> "$runtime_env"
          else
            echo "::warning::PASSPORT_PRIVATE_KEY and PASSPORT_PUBLIC_KEY are not set. AI tools cannot sign in until they are."
          fi

          chmod 0600 "$runtime_env"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The runner is thrown away, so tearing the builder down only costs time.
          cleanup: false

      - name: Log In To GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./.docker/production/images/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.name }}:latest
          # A registry cache outlives the release tag it was made on. The Actions
          # cache is scoped to one ref, so no release could reuse the last one.
          # mode=min keeps only the layers of the final image, which the push has
          # just sent, so the export is a manifest and nothing waits on it.
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=min,ignore-error=true
          secret-files: |
            runtime_env=/tmp/traceway.runtime.env

  deploy:
    name: Deploy To Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: production
      url: https://traceway.online

    steps:
      # The Cloudflare step reads the planner paths from the nginx config the
      # image was built with.
      - name: Check Out Nginx Config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .docker/production/images/configs/nginx/nginx.conf
          sparse-checkout-cone-mode: false

      - name: Validate Deploy Configuration
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_HOST:-}" || { echo "PRODUCTION_HOST secret is required"; exit 1; }
          test -n "${PRODUCTION_USER:-}" || { echo "PRODUCTION_USER secret is required"; exit 1; }
          test -n "${PRODUCTION_SSH_KEY:-}" || { echo "PRODUCTION_SSH_KEY secret is required"; exit 1; }

      - name: Deploy Production On VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          TRACEWAY_IMAGE: ${{ needs.build.outputs.image }}
          OPS_REPO_DIR: ${{ vars.OPS_REPO_DIR }}
          OPS_REPO_REF: ${{ vars.OPS_REPO_REF }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: GHCR_PAT,GHCR_USERNAME,TRACEWAY_IMAGE,OPS_REPO_DIR,OPS_REPO_REF
          script: |
            set -euo pipefail

            cd "${OPS_REPO_DIR}"
            git fetch origin
            git checkout "${OPS_REPO_REF:-main}"
            git pull --ff-only origin "${OPS_REPO_REF:-main}"

            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_PAT:-}" ]; then
              echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            export TRACEWAY_IMAGE
            cd traceway
            ./deploy.sh

            # Every release leaves its image behind. Drop each image no
            # container uses. A rollback pulls its release from GHCR again.
            docker image prune --all --force \
              || echo "::warning::Pruning old Docker images on the server failed."
            df -h /

      - name: Cache Site Pages On Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          NGINX_CONF: .docker/production/images/configs/nginx/nginx.conf
        run: |
          set -euo pipefail

          # The token needs Cache Rules: Edit and Cache Purge: Purge on the
          # traceway.online zone. Without it the rule from the last deploy
          # stays, and Cloudflare keeps the old release's pages for a day.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID is not set, so Cloudflare's cache was not purged. Set them, or delete the cache rule on the zone." >&2
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}"

          # The planner paths are the ones nginx hands to Laravel, so the rule
          # and nginx cannot drift apart.
          paths="$(sed -nE 's#^ *location ~ \^/\(([^)]+)\)\(/\|\$\) \{$#\1#p' "$NGINX_CONF" | tr -d '\\')"
          if [ -z "$paths" ]; then
            echo "::error::Could not find the planner paths in ${NGINX_CONF}." >&2
            exit 1
          fi

          exact=""
          below=""
          IFS='|' read -ra prefixes <<< "$paths"
          for prefix in "${prefixes[@]}"; do
            exact+=" \"/${prefix}\""
            below+=" or starts_with(http.request.uri.path, \"/${prefix}/\")"
          done
          planner="http.request.uri.path in {${exact# }}${below}"

          # Cloudflare keeps the rest of traceway.online for as long as nginx's
          # Cache-Control allows. Its cache key ignores Accept, so a request
          # for a Markdown twin always goes to the server. nginx matches
          # text/markdown case-sensitively too. Cloudflare does not decode %2F
          # but Laravel does, so an encoded path always goes to the server.
          expression="http.host eq \"traceway.online\" and not (${planner}) and not ends_with(http.request.uri.path, \".php\") and not http.request.uri.path contains \"%\" and not any(http.request.headers[\"accept\"][*] contains \"text/markdown\")"

          # This replaces every cache rule on the zone. Change them here, not
          # in the dashboard. Browsers keep nginx's max-age=0, whatever the
          # zone's Browser Cache TTL says.
          jq -n --arg expression "$expression" '{
            rules: [{
              description: "Site pages from the Astro build",
              expression: $expression,
              action: "set_cache_settings",
              action_parameters: {
                cache: true,
                edge_ttl: { mode: "respect_origin" },
                browser_ttl: { mode: "respect_origin" }
              }
            }]
          }' > "${RUNNER_TEMP}/cache-rules.json"

          rule_failed=0
          curl --fail-with-body --silent --show-error --output /dev/null \
            --request PUT "${api}/rulesets/phases/http_request_cache_settings/entrypoint" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @"${RUNNER_TEMP}/cache-rules.json" \
            || rule_failed=1

          # The new release is live, so nothing Cloudflare kept is current.
          # Purge even when the rule failed, or the last deploy's rule keeps
          # the old pages, which point at /_astro files that are gone.
          curl --fail-with-body --silent --show-error --output /dev/null \
            --request POST "${api}/purge_cache" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}'

          if [ "$rule_failed" -eq 1 ]; then
            echo "::error::Cloudflare turned down the cache rule. The cache was purged, and the last deploy's rule still applies." >&2
            exit 1
          fi

          # The first visit fills the cache, so the second comes from it. The
          # release is already live, so a failed check only warns.
          for page in / /privacy; do
            curl --silent --output /dev/null "https://traceway.online${page}" || true
            status="$(curl --silent --head "https://traceway.online${page}" | tr -d '\r' | awk -F': ' 'tolower($1) == "cf-cache-status" { print $2 }' || true)"
            echo "${page}: ${status:-no cf-cache-status}"
            if [ "${status}" != "HIT" ]; then
              echo "::warning::Cloudflare did not serve ${page} from its cache (${status:-no cf-cache-status})."
            fi
          done

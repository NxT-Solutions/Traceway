name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Planner checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, exif, intl, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mail/package-lock.json

      # The mail tests read the HTML this writes to resources/views/mail/compiled.
      - name: Build Account Mail
        working-directory: apps/mail
        run: |
          npm ci
          npm run build

      - name: Run All Checks
        run: composer ci:check

  web:
    name: Content site checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # --prefix keeps npm on this app's own lockfile, as the image build does,
      # instead of the root workspace lockfile.
      - name: Install Dependencies
        run: npm ci --prefix .

      - name: Build Site
        run: npm run build

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Planner lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/app

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, exif, intl, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Lint Checks
        run: composer ci:lint

  app:
    name: Planner checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/app

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, exif, intl, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Assets
        run: bun run build

      # The mail tests read the HTML Maizzle writes to resources/views/mail/compiled.
      # That build depends on apps/mail alone, so a run that changed nothing there restores it.
      - name: Restore Account Mail
        id: mail
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/resources/views/mail/compiled
          key: mail-${{ runner.os }}-${{ hashFiles('apps/mail/**') }}

      - name: Set Up Node
        if: steps.mail.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mail/package-lock.json

      - name: Build Account Mail
        if: steps.mail.outputs.cache-hit != 'true'
        working-directory: apps/mail
        run: |
          npm ci
          npm run build

      - name: Run Type Checks And Tests
        run: composer ci:test

  web:
    name: Content site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # --prefix keeps npm on this app's own lockfile, as the image build does,
      # instead of the root workspace lockfile.
      - name: Install Dependencies
        run: npm ci --prefix .

      - name: Build Site
        run: npm run build

  browser:
    name: Browser checks
    # Pinned, not ubuntu-latest: the Chromium step skips Playwright's apt
    # install and relies on the libraries this image ships.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/app
    env:
      BASE_URL: http://127.0.0.1:8000
      CONTENT_URL: http://127.0.0.1:4321
      # A pull request draws routes through a stand-in router, so it never
      # waits on the public one. A push to main keeps the real engine.
      USE_ROUTER_STUB: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: bcmath, exif, intl, pcntl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache Composer Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/app/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # The demo riders sign in only when APP_ENV is local, as in .env.example.
      - name: Prepare Environment
        run: |
          cp .env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
          echo 'SESSION_SECURE_COOKIE=false' >> .env
          if [ "$USE_ROUTER_STUB" = "true" ]; then
            sed -i 's|^VALHALLA_URL=.*|VALHALLA_URL=http://127.0.0.1:8002|' .env
            sed -i 's|^OPENFREEMAP_URL=.*|OPENFREEMAP_URL=http://127.0.0.1:8002|' .env
            sed -i 's|^NOMINATIM_URL=.*|NOMINATIM_URL=http://127.0.0.1:8002|' .env
          fi
          php artisan key:generate --no-interaction
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate --seed --force --no-interaction

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      # The three builds do not depend on each other. The tests launch only
      # Chromium's headless shell, and the runner image already has every
      # library it needs, so the install is one download.
      - name: Build Assets, Content Site, And Browser
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          bun run build:ssr > "$RUNNER_TEMP/build/assets.log" 2>&1 & assets=$!
          (cd ../web && npm ci --prefix . && npm run build) > "$RUNNER_TEMP/build/content.log" 2>&1 & content=$!
          bunx playwright-core install --only-shell chromium > "$RUNNER_TEMP/build/browser.log" 2>&1 & browser=$!
          status=0
          for name in assets content browser; do
            if wait "${!name}"; then result=done; else result=FAILED; status=1; fi
            echo "::group::$name ($result)"
            cat "$RUNNER_TEMP/build/$name.log"
            echo "::endgroup::"
          done
          exit "$status"

      # The planner gets workers so a routing call in one lane does not hold
      # up page loads in the other. The content site is static files. The
      # SSR server draws the planner's pages first, as in production, so the
      # tests also catch a page the browser draws differently.
      - name: Start Servers
        run: |
          bun bootstrap/ssr/app.js > "$RUNNER_TEMP/ssr.log" 2>&1 &
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --no-reload --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/planner.log" 2>&1 &
          php -S 127.0.0.1:4321 -t ../web/dist > "$RUNNER_TEMP/content.log" 2>&1 &
          urls=("http://127.0.0.1:13714/health" "$BASE_URL/login" "$CONTENT_URL/")
          if [ "$USE_ROUTER_STUB" = "true" ]; then
            PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8002 tests/Browser/valhalla-stub.php > "$RUNNER_TEMP/router.log" 2>&1 &
            urls+=("http://127.0.0.1:8002/health")
          fi
          for url in "${urls[@]}"; do
            for attempt in $(seq 1 300); do
              curl --silent --fail --output /dev/null "$url" && break
              sleep 0.2
            done
            curl --silent --fail --output /dev/null "$url"
          done

      # Two lanes of about the same length. The phone test is the long one.
      # On main they take turns: both use the public router, and the brick
      # the phone lane draws slows the desktop lane's road lookups.
      - name: Run Browser Tests
        run: |
          desktop() { node tests/Browser/planner.mjs && node tests/Browser/wcag.mjs; }
          mobile() { node tests/Browser/mobile.mjs; }
          declare -A pid result
          for lane in desktop mobile; do
            if [ "$USE_ROUTER_STUB" = "true" ]; then
              "$lane" > "$RUNNER_TEMP/browser-$lane.log" 2>&1 & pid[$lane]=$!
            elif "$lane" > "$RUNNER_TEMP/browser-$lane.log" 2>&1; then
              result[$lane]=passed
            else
              result[$lane]=FAILED
            fi
          done
          status=0
          for lane in desktop mobile; do
            if [ -n "${pid[$lane]:-}" ]; then
              if wait "${pid[$lane]}"; then result[$lane]=passed; else result[$lane]=FAILED; fi
            fi
            [ "${result[$lane]}" = passed ] || status=1
            echo "::group::$lane lane (${result[$lane]})"
            cat "$RUNNER_TEMP/browser-$lane.log"
            echo "::endgroup::"
          done
          exit "$status"

      - name: Show Server Logs
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/planner.log" || true
          tail -n 50 "$RUNNER_TEMP/ssr.log" || true
          tail -n 50 "$RUNNER_TEMP/content.log" || true
          tail -n 50 "$RUNNER_TEMP/router.log" || true
          tail -n 100 storage/logs/laravel.log || true

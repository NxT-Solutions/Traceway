name: Garmin App

on:
  # Nothing outside apps/garmin reaches the build, so other changes skip it.
  pull_request:
    paths:
      - apps/garmin/**
      - .github/workflows/garmin.yml
  push:
    branches: [main]
    paths:
      - apps/garmin/**
      - .github/workflows/garmin.yml
  # A weekly build shows a changed SDK licence or a login problem before a release does.
  schedule:
    - cron: "0 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-${{ github.ref }}
  cancel-in-progress: true

env:
  CONNECTIQ_SDK_VERSION: "9.2.0"
  SDK_MANAGER_VERSION: "0.8.4"
  SDK_MANAGER_SHA256: 5d57b8f9cfcd02d3b3f48e19d6daca0480e4c6f627926f15d8617ef8a6f57e0b
  # The Connect IQ SDK license as accepted in the SDK manager. When Garmin
  # changes it, this job fails until the new one is accepted and pinned here.
  CONNECTIQ_AGREEMENT_HASH: CC737BBBA104D7740D5BBCF27D0F6382

jobs:
  build:
    name: Garmin app build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/garmin
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Device files need a Garmin login. Forks and Dependabot get no
      # secrets, so their pull requests skip the build instead of failing.
      - name: Check Garmin Login
        id: login
        run: |
          if [ -n "$GARMIN_USERNAME" ] && [ -n "$GARMIN_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "::error::GARMIN_USERNAME and GARMIN_PASSWORD are required to release the Garmin app."
            exit 1
          else
            echo "::notice::No Garmin login in this run, so the Garmin app was not built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Up Java
        if: steps.login.outputs.ready == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Connect IQ SDK And Devices
        if: steps.login.outputs.ready == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.Garmin/ConnectIQ
          key: connectiq-${{ runner.os }}-${{ env.CONNECTIQ_SDK_VERSION }}-${{ hashFiles('apps/garmin/manifest.xml') }}
          restore-keys: connectiq-${{ runner.os }}-${{ env.CONNECTIQ_SDK_VERSION }}-

      - name: Install Connect IQ SDK Manager
        if: steps.login.outputs.ready == 'true'
        run: |
          set -euo pipefail
          archive="connect-iq-sdk-manager-cli_${SDK_MANAGER_VERSION}_Linux_x86_64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/lindell/connect-iq-sdk-manager-cli/releases/download/v${SDK_MANAGER_VERSION}/${archive}"
          echo "${SDK_MANAGER_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/sdk-manager"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/sdk-manager"
          echo "$RUNNER_TEMP/sdk-manager" >> "$GITHUB_PATH"

      - name: Install SDK And Devices
        if: steps.login.outputs.ready == 'true'
        run: |
          set -euo pipefail
          connect-iq-sdk-manager agreement accept --agreement-hash="$CONNECTIQ_AGREEMENT_HASH"
          connect-iq-sdk-manager login
          connect-iq-sdk-manager sdk set "$CONNECTIQ_SDK_VERSION"
          connect-iq-sdk-manager device download --manifest=manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> "$GITHUB_PATH"

      # A release is signed with the key the store knows. Every other build
      # gets a throwaway key, so pull requests never touch the real one.
      - name: Prepare Signing Key
        if: steps.login.outputs.ready == 'true'
        env:
          CONNECTIQ_DEVELOPER_KEY: ${{ github.event_name == 'release' && secrets.CONNECTIQ_DEVELOPER_KEY || '' }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/developer_key.der"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ -z "$CONNECTIQ_DEVELOPER_KEY" ]; then
              echo "::error::CONNECTIQ_DEVELOPER_KEY is required to release the Garmin app."
              exit 1
            fi
            printf '%s' "$CONNECTIQ_DEVELOPER_KEY" | base64 --decode > "$key"
          else
            openssl genrsa -out "$RUNNER_TEMP/developer_key.pem" 4096 2> /dev/null
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/developer_key.pem" -out "$key" -nocrypt
          fi
          chmod 600 "$key"
          echo "DEVELOPER_KEY=$key" >> "$GITHUB_ENV"

      - name: Stamp Release Version
        if: steps.login.outputs.ready == 'true' && github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not vX.Y.Z."
            exit 1
          fi
          sed -i "s/version=\"0\.0\.0\"/version=\"$version\"/" manifest.xml
          grep -q "version=\"$version\"" manifest.xml

      # Exporting compiles the app for every product in the manifest.
      - name: Build Store Package
        if: steps.login.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          monkeyc -f monkey.jungle -e -r -w -y "$DEVELOPER_KEY" -o dist/traceway.iq

      # The store listing images are SVG sources. They are drawn here, so nothing rendered is committed.
      - name: Render Store Images
        if: steps.login.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends librsvg2-bin > /dev/null
          mkdir -p dist/store
          rsvg-convert --width 500 --height 500 store/icon.svg --output dist/store/traceway-store-icon.png
          rsvg-convert --width 1440 --height 720 store/hero.svg --output dist/store/traceway-store-hero.png

      - name: Upload Store Package
        if: steps.login.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traceway-garmin
          path: |
            apps/garmin/dist/traceway.iq
            apps/garmin/dist/store/*.png
          if-no-files-found: error
          retention-days: 14

  # Signs in to the Connect IQ Store and reads the listing, changing nothing.
  # Run weekly and on pull requests, it shows a broken sign-in or a changed
  # dashboard before a release needs the automatic upload.
  store:
    name: Connect IQ Store sign-in
    if: github.event_name != 'release' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The account that owns the store listing. It can differ from the one CI
    # downloads the SDK with, so it has its own secrets and falls back to those.
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_STORE_USERNAME || secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_STORE_PASSWORD || secrets.GARMIN_PASSWORD }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks and Dependabot get no secrets, so their pull requests skip it.
      - name: Check The Listing
        run: |
          set -euo pipefail
          if [ -z "$GARMIN_USERNAME" ] || [ -z "$GARMIN_PASSWORD" ]; then
            echo "::notice::No Garmin login in this run, so the store was not checked."
            exit 0
          fi
          python3 apps/garmin/tools/connectiq_store.py check

  release:
    name: Attach Garmin app to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      # The store listing. Each new version is an upload on this page, under Upload New Version.
      STORE_PAGE: https://apps.garmin.com/apps/a0c32e89-323f-4522-9ee8-c6af6cce14c3

    steps:
      - name: Check Out Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Most releases change only the planner or the site, and need no upload.
      - name: Check Whether The App Changed
        id: changed
        run: |
          set -euo pipefail
          # The last release that attached the app is the one riders have. A
          # release whose Garmin build failed attached nothing, so it is skipped.
          previous=""
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            [ "$tag" = "$TAG" ] && continue
            git merge-base --is-ancestor "$tag" "$TAG" 2>/dev/null || continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '^traceway-garmin-.*\.iq$'; then
              previous="$tag"
              break
            fi
          done

          # Everything under apps/garmin ships, except the notes, the store images, and the store tools.
          if [ -z "$previous" ] || ! git diff --quiet "$previous" "$TAG" -- apps/garmin ':!apps/garmin/README.md' ':!apps/garmin/store' ':!apps/garmin/tools'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Garmin app is the same as in ${previous}, so ${TAG} has nothing to upload to the Connect IQ Store."
          fi

      - name: Download Store Package
        if: steps.changed.outputs.app == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traceway-garmin
          path: dist

      - name: Attach To Release
        if: steps.changed.outputs.app == 'true'
        run: |
          set -euo pipefail
          mv dist/traceway.iq "dist/traceway-garmin-${TAG}.iq"
          gh release upload "$TAG" "dist/traceway-garmin-${TAG}.iq" dist/store/*.png --clobber --repo "$GITHUB_REPOSITORY"

      # What's New comes from this release's rider notes in the Devices section.
      - name: Write What's New
        if: steps.changed.outputs.app == 'true'
        run: |
          set -euo pipefail
          whats_new="$(
            for note in apps/app/resources/releases/"${TAG}"/*.md; do
              [ -e "$note" ] || continue
              [ "$(basename "$note")" = "_release.md" ] && continue
              tr -d '\r' < "$note" | awk 'NR==1 && $0=="---" {front=1; next} front && $0=="---" {front=0; next} front && /^section:/ {section=$2} !front && section=="Devices" && /^[[:space:]]*- / {print}'
            done | sed -E 's/\*\*//g'
          )"
          [ -n "$whats_new" ] || whats_new="- Small fixes and improvements."
          printf '%s\n' "$whats_new" > dist/whats-new.txt

      # Garmin has no public upload API. This uses the developer dashboard's own
      # endpoints with the developer's Garmin login, so it can break when Garmin
      # changes the dashboard. Then the reminder below asks for a manual upload.
      - name: Publish To Connect IQ Store
        id: publish
        if: steps.changed.outputs.app == 'true'
        continue-on-error: true
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_STORE_USERNAME || secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_STORE_PASSWORD || secrets.GARMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 apps/garmin/tools/connectiq_store.py upload \
            --iq "dist/traceway-garmin-${TAG}.iq" \
            --version "${TAG#v}" \
            --whats-new dist/whats-new.txt \
            --result dist/store-result.txt

      # Only when the upload did not go through: an issue for the person who
      # published the release, open until the upload is done by hand.
      - name: Open Store Upload Reminder
        if: steps.changed.outputs.app == 'true' && steps.publish.outcome != 'success'
        env:
          AUTHOR: ${{ github.event.release.author.login }}
          AUTHOR_TYPE: ${{ github.event.release.author.type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          title="Upload Traceway for Garmin ${TAG} to the Connect IQ Store"

          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number --jq '.[].number' | grep -q .; then
            echo "::notice::The upload reminder for ${TAG} is already open."
            exit 0
          fi

          body_file="$(mktemp)"
          progress="$(cat dist/store-result.txt 2>/dev/null || echo none)"
          if [ "$progress" = "uploaded" ]; then
            {
              echo "[The automatic upload](${RUN_URL}) put ${TAG} on the Connect IQ Store, but could not set What's New."
              echo
              echo "1. Open [the Traceway store page](${STORE_PAGE}) and choose **Edit Details**. Do not upload the version again: it is already there."
              echo "2. Paste this under What's New, then submit:"
              echo
              echo '```'
              cat dist/whats-new.txt
              echo '```'
              echo
              echo "Close this issue when it is saved."
            } > "$body_file"
          else
          {
            echo "${TAG} changed the Garmin app, and [the automatic upload](${RUN_URL}) did not go through. Upload it by hand. It takes about two minutes."
            echo
            echo "1. Download [traceway-garmin-${TAG}.iq](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/traceway-garmin-${TAG}.iq)."
            echo "2. Open [the Traceway store page](${STORE_PAGE}) and choose **Upload New Version**. Not Upload an App: that would make a second listing."
            echo "3. Pick the file, and type the version: \`${version}\`"
            echo "4. Paste this under What's New, then submit:"
            echo
            echo '```'
            cat dist/whats-new.txt
            echo '```'
            echo
            echo "Close this issue when Garmin has the new version. Riders' devices update by themselves once Garmin approves it."
          } > "$body_file"
          fi

          assignee=()
          if [ "$AUTHOR_TYPE" = "User" ]; then
            assignee=(--assignee "$AUTHOR")
          fi

          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file" "${assignee[@]}"

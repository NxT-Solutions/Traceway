# Groups the technical notes GitHub writes for a release: pull requests, labels,
# and contributors. Riders never read these. The notes riders read in the
# planner's What's new live in apps/app/resources/releases, one file per branch.
# Releases are cut by the Release workflow (.github/workflows/release.yml).
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Devices
      labels: [device]
    - title: Docs
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]

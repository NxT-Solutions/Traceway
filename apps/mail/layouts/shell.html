<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traceway</title>
  <style>
    body { margin: 0; padding: 0; background: #f6f3ea; color: #1d3338; }
    .canvas { width: 100%; background: #f6f3ea; padding: 32px 16px; }
    .card { width: 100%; max-width: 560px; background: #fffcf6; border: 1px solid #e6e1d4; border-radius: 16px; }
    .pad { padding: 28px 28px 24px; font-family: 'Avenir Next', 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; color: #1d3338; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
    p { margin: 0 0 16px; }
    .muted { color: #5c6b66; font-size: 14px; }
    .button { display: inline-block; padding: 12px 18px; border-radius: 10px; background: #c6df4a; color: #1c2910; font-size: 15px; font-weight: 600; text-decoration: none; }
    .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; color: #1d3338; text-decoration: none; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: #c6df4a; }
    .foot { padding: 16px 4px 0; font-family: 'Avenir Next', 'Segoe UI', sans-serif; font-size: 12px; line-height: 1.45; color: #5c6b66; }
  </style>
</head>
<body>
  <table class="canvas" role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px;">
          <tr>
            <td style="padding: 0 4px 16px;">
              <span class="dot"></span>
              <a class="brand" href="%%HOME%%">Traceway</a>
            </td>
          </tr>
          <tr>
            <td class="card">
              <div class="pad">
                <content></content>
              </div>
            </td>
          </tr>
          <tr>
            <td class="foot">
              Traceway draws a loop you can ride. This message was sent to %%EMAIL%%.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

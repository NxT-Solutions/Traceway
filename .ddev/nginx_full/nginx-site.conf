# One host. Astro serves /. Laravel serves the planner paths.
# Do not add the DDEV generated-file marker; DDEV would replace this config.

# The headers production nginx sends for the content site
# (.docker/production/images/configs/nginx/security-headers.conf), apart from
# its Content-Security-Policy, since astro dev runs inline scripts and styles
# for live reload, and HSTS, which would send Mailpit on :8025 to HTTPS.
# Laravel sends its own headers for the planner paths.
map $sent_http_content_type $site_permissions {
    "~^text/html" "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
    default "";
}

map $sent_http_content_type $site_frame_options {
    "~^text/html" "DENY";
    default "";
}

map $sent_http_content_type $site_opener_policy {
    "~^text/html" "same-origin";
    default "";
}

map $sent_http_content_type $site_resource_policy {
    "~^(text/html|text/css|application/javascript|text/javascript|font/)" "same-origin";
    default "";
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    root /var/www/html/apps/app/public;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.html index.htm index.php /ddev-webserver-403-error;

    charset utf-8;

    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    client_max_body_size 128M;

    # nginx runs as you, but the image's own temp folders belong to another
    # user, so a long route POST or a big download failed with a 500.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    # Laravel Vite. Kept off the site root so it does not collide with Astro.
    location ^~ /_app/ {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    location ^~ /@vite/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 86400;
    }

    location ^~ /@id/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /@fs/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /src/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ^~ /node_modules/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Storybook as production serves it: the planner's at /storybook/app/ and
    # the site's at /storybook/web/, from their last builds
    # (`bun run build-storybook` in apps/app, `npm run build-storybook` in
    # apps/web). The overview at /storybook is the site's own page. Like the
    # site above, the headers leave out production's policy and HSTS
    # (storybook-headers.conf); the Referrer-Policy stays, since Laravel reads
    # the full address to refuse a change sent from Storybook.
    location ~ ^/storybook/(app|web)$ {
        absolute_redirect off;
        return 301 $uri/;
    }

    location ~ ^/storybook/app/(?<storybook_file>.*)$ {
        alias /var/www/html/apps/app/storybook-static/$storybook_file;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/storybook/web/(?<storybook_file>.*)$ {
        alias /var/www/html/apps/web/storybook-static/$storybook_file;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_pass_header "X-Accel-Buffering";
        fastcgi_pass_header "X-Accel-Charset";
        fastcgi_pass_header "X-Accel-Expires";
        fastcgi_pass_header "X-Accel-Limit-Rate";
        fastcgi_pass_header "X-Accel-Redirect";
    }

    # Planner and account. Everything else is the content site.
    location ~ ^/(\.well-known|login|logout|register|auth|forgot-password|reset-password|email|two-factor-challenge|dashboard|saved|settings|user|passkeys|routes|share|status|up|docs|_boost|build|storage|sanctum|mcp|oauth|admin)(/|$) {
        absolute_redirect off;
        try_files $uri /index.php?$query_string;
    }

    location ~* /\.(?!well-known\/) {
        deny all;
    }

    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    location / {
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $site_permissions always;
        add_header X-Frame-Options $site_frame_options always;
        add_header Cross-Origin-Opener-Policy $site_opener_policy always;
        add_header Cross-Origin-Resource-Policy $site_resource_policy always;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}

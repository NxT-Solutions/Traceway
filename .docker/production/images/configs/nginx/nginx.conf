user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  server {
    listen 8080;
    server_name _;

    # The content site is static. Planner paths go to Laravel.
    root /var/www/web;
    index index.html;

    location = /favicon.ico {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location = /favicon.svg {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location = /apple-touch-icon.png {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location ~ ^/(\.well-known|login|logout|register|forgot-password|reset-password|email|two-factor-challenge|dashboard|saved|settings|user|passkeys|routes|share|up|docs|build|storage|sanctum)(/|$) {
      root /var/www/html/public;
      try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
      root /var/www/html/public;
      include fastcgi_params;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
      deny all;
    }

    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}

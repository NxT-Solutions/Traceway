user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  # AI tools ask for Markdown. The home page answers with its .md twin.
  map $http_accept $wants_markdown {
    default 0;
    "~*text/markdown" 1;
  }

  server {
    listen 8080;
    server_name _;

    # Caddy terminates TLS and proxies to port 8080. An absolute redirect
    # would send the browser to http://host:8080, which is not reachable.
    absolute_redirect off;

    # The content site is static. Planner paths go to Laravel.
    root /var/www/web;
    index index.html;

    location = /favicon.ico {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location = /favicon.svg {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location = /apple-touch-icon.png {
      root /var/www/html/public;
      access_log off;
      log_not_found off;
    }

    location ~ ^/(\.well-known|login|logout|register|forgot-password|reset-password|email|two-factor-challenge|dashboard|saved|settings|user|passkeys|routes|share|up|docs|build|storage|sanctum)(/|$) {
      root /var/www/html/public;
      try_files $uri /index.php?$query_string;
    }

    # Vite and Astro hash these file names, so they never change in place.
    location ^~ /build/assets/ {
      root /var/www/html/public;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location ^~ /_astro/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location ~ \.php$ {
      root /var/www/html/public;
      include fastcgi_params;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
      deny all;
    }

    location = / {
      if ($wants_markdown) {
        rewrite ^ /index.md last;
      }
      add_header Vary Accept;
      add_header Link '</index.md>; rel="alternate"; type="text/markdown"';
      try_files /index.html =404;
    }

    # The Markdown twin points back at the page, so search shows the page.
    location ~ \.md$ {
      types { }
      default_type "text/markdown; charset=utf-8";
      add_header Vary Accept;
      add_header Link '<https://$host/>; rel="canonical"';
      try_files $uri =404;
    }

    location ~ ^/(robots|llms|llms-full)\.txt$ {
      charset utf-8;
      try_files $uri =404;
    }

    # Astro writes a redirect like /sports as /sports/index.html. Serve it at
    # the link the site uses instead of redirecting to the trailing slash.
    location / {
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}

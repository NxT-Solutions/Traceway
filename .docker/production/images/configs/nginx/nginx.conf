user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  # Error pages and the Server header do not name the nginx version.
  server_tokens off;
  client_max_body_size 32m;

  # Text answers go out compressed. Cloudflare passes gzip on, or swaps it
  # for Brotli, and visitors who reach the origin directly get it too.
  # nginx always compresses text/html once gzip is on.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/geo+json
    application/gpx+xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/markdown
    text/plain
    text/xml;

  # AI tools ask for Markdown. The home page answers with its .md twin.
  # Case-sensitive, like the Cloudflare cache rule in production-deploy.yml,
  # so Cloudflare never keeps the Markdown answer as the home page.
  map $http_accept $wants_markdown {
    default 0;
    "~text/markdown" 1;
  }

  # $site_script_hashes and $site_style_hashes: the hashes of the inline
  # script and style tags in the content site's pages, written by the build
  # (apps/web/csp.mjs).
  include /etc/nginx/nginx-csp.conf;

  # Headers for the pages nginx serves itself; security-headers.conf sends
  # them. A script runs only when its hash is listed, or when such a script
  # loaded it ('strict-dynamic'), so an injected tag never runs. Browsers that
  # know 'strict-dynamic' ignore 'unsafe-inline', 'self' and the counter's
  # host; they are there only for older browsers, which then run what main
  # allowed: the site's own files and the counter. Trusted Types keep
  # scripts from turning text into markup or a script address. Only style=""
  # attributes are allowed inline.
  # Cloudflare's visit counter loads only after the visitor says yes, through
  # the "counter" policy (apps/web/src/components/Consent.astro). The
  # build's loader adds the site's script files through the "scripts" one.
  map $sent_http_content_type $site_csp {
    "~^text/html" "default-src 'none'; script-src $site_script_hashes 'strict-dynamic' 'unsafe-inline' 'self' https://static.cloudflareinsights.com; style-src 'self' $site_style_hashes; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types scripts counter";
    default "";
  }

  map $sent_http_content_type $site_permissions {
    "~^text/html" "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()";
    default "";
  }

  map $sent_http_content_type $site_frame_options {
    "~^text/html" "DENY";
    default "";
  }

  map $sent_http_content_type $site_opener_policy {
    "~^text/html" "same-origin";
    default "";
  }

  # Pages, scripts, styles and fonts stay on this site. Images do not, so a
  # mail app or a chat can still show the preview picture.
  map $sent_http_content_type $site_resource_policy {
    "~^(text/html|text/css|application/javascript|text/javascript|font/)" "same-origin";
    default "";
  }

  server {
    listen 8080;
    server_name _;

    # Caddy terminates TLS and proxies to port 8080. An absolute redirect
    # would send the browser to http://host:8080, which is not reachable.
    absolute_redirect off;

    # The content site is static. Planner paths go to Laravel.
    root /var/www/web;
    index index.html;

    # Branded pages from the Astro build for the errors nginx answers itself:
    # a missing file, a refused path, or PHP being down. Laravel draws its own
    # for the planner paths.
    error_page 404 /404.html;
    error_page 400 /errors/400/index.html;
    error_page 403 /errors/403/index.html;
    error_page 405 /errors/405/index.html;
    error_page 408 /errors/408/index.html;
    error_page 413 /errors/413/index.html;
    error_page 414 /errors/414/index.html;
    error_page 500 /errors/500/index.html;
    error_page 502 /errors/502/index.html;
    error_page 503 /errors/503/index.html;
    error_page 504 /errors/504/index.html;

    location = /404.html {
      internal;
      include /etc/nginx/security-headers.conf;
    }

    location ^~ /errors/ {
      internal;
      include /etc/nginx/security-headers.conf;
    }

    location = /favicon.ico {
      root /var/www/html/public;
      add_header Cache-Control "public, max-age=604800";
      access_log off;
      log_not_found off;
      include /etc/nginx/security-headers.conf;
    }

    location = /favicon.svg {
      root /var/www/html/public;
      add_header Cache-Control "public, max-age=604800";
      access_log off;
      log_not_found off;
      include /etc/nginx/security-headers.conf;
    }

    location = /apple-touch-icon.png {
      root /var/www/html/public;
      add_header Cache-Control "public, max-age=604800";
      access_log off;
      log_not_found off;
      include /etc/nginx/security-headers.conf;
    }

    # How to report a security problem (RFC 9116). The content site's build
    # writes it; the rest of /.well-known belongs to Laravel.
    location = /.well-known/security.txt {
      charset utf-8;
      default_type text/plain;
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      include /etc/nginx/security-headers.conf;
      try_files /security.txt =404;
    }

    location ~ ^/(\.well-known|api|login|logout|register|forgot-password|reset-password|email|two-factor-challenge|dashboard|saved|settings|user|passkeys|routes|share|status|up|docs|build|storage|sanctum|mcp|oauth|admin)(/|$) {
      root /var/www/html/public;
      # A file from disk, such as a route image under /storage. Laravel's
      # answers pass through the PHP location and bring their own headers.
      include /etc/nginx/security-headers.conf;
      try_files $uri /index.php?$query_string;
    }

    # Vite and Astro hash these file names, so they never change in place.
    location ^~ /build/assets/ {
      root /var/www/html/public;
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location ^~ /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location ~ \.php$ {
      root /var/www/html/public;
      # A missing script gets the site's 404 with its headers, not PHP-FPM's bare page.
      try_files $uri =404;
      include fastcgi_params;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_index index.php;
      fastcgi_read_timeout 60s;
      # A planner page's headers hold a Link entry for every preloaded file,
      # each with the CSP nonce, and the CSP itself: about 6 KB, past nginx's
      # one-page default, which answers 502.
      fastcgi_buffer_size 32k;
      fastcgi_buffers 16 32k;
    }

    location ~ /\.(?!well-known) {
      deny all;
    }

    # The site's pages change only with a release. Cloudflare keeps them for
    # a day (s-maxage), and the deploy purges its cache. Browsers ask again
    # each visit (max-age=0), so they never show an old page. Planner paths
    # set no header here, so Laravel's private answers are never shared.
    location = / {
      if ($wants_markdown) {
        rewrite ^ /index.md last;
      }
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      add_header Vary Accept;
      add_header Link '</index.md>; rel="alternate"; type="text/markdown"';
      include /etc/nginx/security-headers.conf;
      try_files /index.html =404;
    }

    # The Markdown twin points back at its own page, so search shows the
    # page: /privacy.md at /privacy, and /index.md at the home page.
    location ~ ^(?<page>/.+)\.md$ {
      set $canonical $page;
      if ($page = /index) {
        set $canonical /;
      }
      types { }
      default_type "text/markdown; charset=utf-8";
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      add_header Vary Accept;
      add_header Link '<https://$host$canonical>; rel="canonical"';
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location ~ ^/(robots|llms|llms-full|security|humans|ads)\.txt$ {
      charset utf-8;
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # nginx's own types do not know .webmanifest.
    location = /manifest.webmanifest {
      types { }
      default_type application/manifest+json;
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # Astro writes a redirect like /sports as /sports/index.html. Serve it at
    # the link the site uses instead of redirecting to the trailing slash.
    location / {
      add_header Cache-Control "public, max-age=0, s-maxage=86400";
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/index.html $uri.html =404;
    }
  }
}

# The browser's safety rules for what nginx answers from disk: the content
# site, its error pages, and the planner's built files. Laravel sends its own
# for the planner pages (app/Http/Middleware/SendSecurityHeaders.php).
#
# A location that sets any add_header loses the server's, so each location
# that answers from disk includes this file. The policy, frame and window
# rules go on pages only ($site_* maps in nginx.conf): a worker script takes
# its policy from its own answer, and the map's worker must reach the tiles.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy $site_csp always;
add_header Permissions-Policy $site_permissions always;
add_header X-Frame-Options $site_frame_options always;
add_header Cross-Origin-Opener-Policy $site_opener_policy always;
add_header Cross-Origin-Resource-Policy $site_resource_policy always;

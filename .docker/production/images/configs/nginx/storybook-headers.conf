# The browser's safety rules for Storybook at /storybook/app/ and
# /storybook/web/ (nginx.conf). Like security-headers.conf, but Storybook is a
# different kind of page:
#
# - It runs inline scripts from its build, and the site's policy only allows
#   scripts it knows the hash of, so scripts and styles from this site run.
# - It shows each story in a frame of its own on this site, so frames from
#   this site are allowed, and nothing else may frame it.
# - The planner's stories draw maps: tiles, styles and glyphs come from
#   OpenFreeMap over https, and MapLibre's worker starts from a blob.
# - Mock Service Worker answers a story's requests from a worker of this site.
# - Pages go out with their full address to this site (Referrer-Policy), so
#   Laravel can tell a request came from Storybook and refuse a change.
# - Search engines leave it out.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;

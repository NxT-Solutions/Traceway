; Traceway's pool. php-fpm reads php-fpm.d in name order, so this file
; overrides the image's www.conf.
;
; Most requests wait on the public map servers, not on the CPU: drawing a
; route holds a worker for up to 12 s, and a road lookup for up to about
; 17 s when the router is busy. The image's pool keeps 5 workers, so a few
; riders placing pins on a slow router took them all, and every page then
; waited behind them.
;
; All 16 workers run from the start. dynamic adds workers in rounds once a
; second, and ondemand stalls after its first few, so a burst of lookups
; queued even with room in the pool: with 12 lookups waiting on a stalled
; router, /up took 3 s with dynamic and 7 s with ondemand, and 6 ms with
; static.
;
; Memory, measured in the production image: 16 idle workers use 63 MB in
; all, and four browser walks at once (planners, route details, a phone)
; peaked at 175 MB, with no worker above 86 MB. The VPS has 3.8 GB and no
; swap, shared with other apps.
[www]
pm = static
pm.max_children = 16

; One web request may use 192 MB, not the 512 MB the command line keeps for
; artisan, so 16 workers at their limit still fit beside the other apps.
php_admin_value[memory_limit] = 192M

; A worker starts fresh now and then, so a slow leak cannot grow for ever.
pm.max_requests = 500

; nginx gives up after 60 s (fastcgi_read_timeout). The worker stops soon
; after, instead of running on for nobody.
request_terminate_timeout = 65s
